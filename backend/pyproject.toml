[project]
name = "norman-backend"
version = "0.1.0"
description = "NORMAN local-first compliance implementation platform"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
Django = "5.2.13"
djangorestframework = ">=3.15,<4"
djangorestframework-simplejwt = ">=5.4,<6"
django-cors-headers = ">=4.4,<5"
psycopg = {version = ">=3.2,<4", extras = ["binary"]}
pgvector = ">=0.3,<1"
celery = ">=5.4,<6"
redis = ">=5,<6"
python-docx = ">=1.1,<2"
openpyxl = ">=3.1,<4"
pandas = ">=2.2,<3"
pypdf = ">=5,<6"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.11,<1"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
